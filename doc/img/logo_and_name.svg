  <circle cx="75.084" cy="111.725" r="16.8" class="gold-circle" />

  <!-- Slanted text centered vertically with respect to the heptagon center -->
  <text x="520" y="268" class="logo-text" dominant-baseline="middle" alignment-baseline="middle">ECGPACK</text>

