<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="690" height="192" viewBox="0 0 1840 512" role="img" aria-labelledby="title desc">
  <title id="title">ECGPACK logo with adjusted heptagon node distances</title>
  <desc id="desc">A heptagon-inspired fully connected emblem with seven gold outer circles whose distances from the center have been adjusted radially: dot 1 unchanged, dot 2 increased by 10 percent, dot 3 decreased by 5 percent, dot 4 increased by 15 percent, dot 5 unchanged, dot 6 decreased by 10 percent, and dot 7 increased by 30 percent. A brown central circle is connected to all seven outer circles. The gold elements are drawn above the brown elements. Slanted ECGPACK text appears to the right, centered vertically with respect to the emblem center.</desc>
  <style>
    .gold-line { stroke: rgb(221,175,83); stroke-width: 5.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .gold-circle { fill: rgb(221,175,83); }
    .brown-line { stroke: rgb(147,87,57); stroke-width: 5.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .brown-circle { fill: rgb(147,87,57); }
    .logo-text { fill: rgb(88,87,75); font-family: Arial, Helvetica, sans-serif; font-style: italic; font-size: 180px; }
  </style>

  <!-- Brown elements underneath: center-to-node radial connections adjusted to the new node locations -->
  <line x1="256.000" y1="256.000" x2="256.000" y2="78.000" class="brown-line" />
  <line x1="256.000" y1="256.000" x2="409.083" y2="133.921" class="brown-line" />
  <line x1="256.000" y1="256.000" x2="420.860" y2="293.629" class="brown-line" />
  <line x1="256.000" y1="256.000" x2="344.816" y2="440.428" class="brown-line" />
  <line x1="256.000" y1="256.000" x2="178.769" y2="416.372" class="brown-line" />
  <line x1="256.000" y1="256.000" x2="99.817" y2="291.648" class="brown-line" />
  <line x1="256.000" y1="256.000" x2="75.084" y2="111.725" class="brown-line" />
  <circle cx="256.000" cy="256.000" r="16.8" class="brown-circle" />

  <!-- Gold elements on top: complete graph among the seven adjusted outer circles -->
  <line x1="256.000" y1="78.000" x2="409.083" y2="133.921" class="gold-line" />
  <line x1="256.000" y1="78.000" x2="420.860" y2="293.629" class="gold-line" />
  <line x1="256.000" y1="78.000" x2="344.816" y2="440.428" class="gold-line" />
  <line x1="256.000" y1="78.000" x2="178.769" y2="416.372" class="gold-line" />
