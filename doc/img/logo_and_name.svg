  <line x1="256.000" y1="78.000" x2="75.084" y2="111.725" class="gold-line" />
  <line x1="409.083" y1="133.921" x2="420.860" y2="293.629" class="gold-line" />
  <line x1="409.083" y1="133.921" x2="344.816" y2="440.428" class="gold-line" />
  <line x1="409.083" y1="133.921" x2="178.769" y2="416.372" class="gold-line" />
  <line x1="409.083" y1="133.921" x2="99.817" y2="291.648" class="gold-line" />
  <line x1="409.083" y1="133.921" x2="75.084" y2="111.725" class="gold-line" />
  <line x1="420.860" y1="293.629" x2="344.816" y2="440.428" class="gold-line" />
  <line x1="420.860" y1="293.629" x2="178.769" y2="416.372" class="gold-line" />
  <line x1="420.860" y1="293.629" x2="99.817" y2="291.648" class="gold-line" />
  <line x1="420.860" y1="293.629" x2="75.084" y2="111.725" class="gold-line" />
  <line x1="344.816" y1="440.428" x2="178.769" y2="416.372" class="gold-line" />
  <line x1="344.816" y1="440.428" x2="99.817" y2="291.648" class="gold-line" />
  <line x1="344.816" y1="440.428" x2="75.084" y2="111.725" class="gold-line" />
