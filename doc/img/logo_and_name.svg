  <line x1="99.817" y1="291.648" x2="75.084" y2="111.725" class="gold-line" />
  <circle cx="256.000" cy="78.000" r="16.8" class="gold-circle" />
  <circle cx="409.083" cy="133.921" r="16.8" class="gold-circle" />
  <circle cx="420.860" cy="293.629" r="16.8" class="gold-circle" />
